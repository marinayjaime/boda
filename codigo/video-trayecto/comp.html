<!DOCTYPE html>
<!-- Trayecto · Palma → Alaró — boda de Marina y Jaime.
     Una sola toma sobre el terreno real: ortofoto PNOA (IGN) drapeada sobre el relieve real, la ruta real por
     carretera (OSM) dibujándose detrás del autobús. La foto del autobús se pliega en el punto de luz que hace el
     trayecto. Todo es función pura de t. ?v = versión vertical (1080×1920). ?play / ?t=6.4 -->
<html lang="es">
<head>
<meta charset="utf-8">
<title>Trayecto · Palma → Alaró</title>
<style>
html,body{margin:0;overflow:hidden;background:#dcd9cf}
canvas{position:absolute;left:0;top:0}
.lay{position:absolute;left:0;top:0;pointer-events:none}
.vig{position:absolute;left:0;right:0;bottom:0;height:52%;background:linear-gradient(to top,rgba(24,24,14,.62),rgba(24,24,14,.28) 45%,rgba(24,24,14,0));opacity:0}
.blk{position:absolute;color:#fcfaf5;will-change:transform,opacity}
.eye{font:500 19px/1.2 'Jost',sans-serif;letter-spacing:.26em;text-transform:uppercase;opacity:.92}
.ttl{font:400 70px/1.04 'Lora',serif;letter-spacing:-.02em;margin-top:16px}
.sub{font:italic 400 44px/1.1 'Lora',serif;margin-top:6px;color:#efe9d8}
.blk span{display:inline-block;will-change:transform,opacity}
.lbl{position:absolute;color:#fcfaf5;font:italic 400 36px/1 'Lora',serif;text-shadow:0 1px 3px rgba(20,20,10,.55),0 2px 22px rgba(20,20,10,.45);white-space:nowrap;transform-origin:0 50%}
.lbl.sm{font:500 17px/1 'Jost',sans-serif;font-style:normal;letter-spacing:.24em;text-transform:uppercase}
.card{position:absolute;left:0;top:0;background:#fcfaf5;padding:14px 14px 12px;box-shadow:0 18px 40px rgba(30,28,16,.35);transform-origin:50% 50%}
.card img{display:block;width:300px;height:auto;background:#efeadc}
.card p{margin:10px 2px 0;font:italic 400 24px/1 'Lora',serif;color:#272819}
.end{position:absolute;left:0;right:0;text-align:center;color:#fcfaf5}
.end .big{font:400 96px/1 'Lora',serif;letter-spacing:-.025em}
.end .big em{font-style:italic}
.end .date{font:500 21px/1 'Jost',sans-serif;letter-spacing:.3em;text-transform:uppercase;margin-top:26px;opacity:.95}
#hud{position:absolute;right:14px;bottom:10px;font:22px monospace;color:#c00;display:none}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="ov"></canvas>
<div class="lay" id="lay">
  <div class="vig" id="vig"></div>
  <div class="lbl" id="lSerra">Serra de Tramuntana</div>
  <div class="lbl" id="lAlaro">Alaró</div>
  <div class="card" id="card"><img id="busImg" alt=""><p>En autobús</p></div>
  <div class="blk" id="bStart">
    <div class="eye"><span>La ceremonia</span></div>
    <div class="ttl"><span>Parroquia de Santa Teresa</span></div>
    <div class="sub"><span>Palma</span></div>
  </div>
  <div class="blk" id="bEnd">
    <div class="eye"><span>La celebración</span></div>
    <div class="ttl"><span>Finca S'Olivaret</span></div>
    <div class="sub"><span>Alaró</span></div>
  </div>
  <div class="end" id="eEnd">
    <div class="big"><span>Nos vemos en <em>Alaró.</em></span></div>
    <div class="date"><span>Sábado · 3 de julio de 2027</span></div>
  </div>
</div>
<div id="hud"></div>
<script src="assets.js"></script>
<script src="three.iife.js"></script>
<script src="motion.js"></script>
<script>
(() => {
const Q = new URLSearchParams(location.search);
const V = Q.has('v');
const W = V ? 1080 : 1920, H = V ? 1920 : 1080;
const DUR = 21, FPS = 30;
const A = window.ASSETS, T3 = window.THREE;
const { clamp, lerp, seg, ease, wordRise, liftOut, spring } = OM;
document.body.style.width = W + 'px'; document.body.style.height = H + 'px';
for (const id of ['gl', 'ov', 'lay']) { const e = document.getElementById(id); e.style.width = W + 'px'; e.style.height = H + 'px'; }
const fst = document.createElement('style'); fst.textContent = A.fontCSS; document.head.appendChild(fst);
document.getElementById('busImg').src = A.textures.bus;

// ─────────────────────────── terreno real ───────────────────────────
const EXAG = 1.15;                                  // relieve real, apenas realzado
const HB = A.height, HD = Float32Array.from(HB.data);
function heightAt(x, z) {
  const u = clamp((x - HB.bounds[0]) / (HB.bounds[2] - HB.bounds[0]), 0, 1) * (HB.w - 1);
  const v = clamp((z - HB.bounds[1]) / (HB.bounds[3] - HB.bounds[1]), 0, 1) * (HB.h - 1);
  const i = Math.min(HB.w - 2, Math.floor(u)), j = Math.min(HB.h - 2, Math.floor(v)), a = u - i, b = v - j;
  const p = (ii, jj) => HD[jj * HB.w + ii];
  return (p(i, j) * (1 - a) * (1 - b) + p(i + 1, j) * a * (1 - b) + p(i, j + 1) * (1 - a) * b + p(i + 1, j + 1) * a * b) * EXAG;
}

const renderer = new T3.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H, false);
renderer.outputColorSpace = T3.SRGBColorSpace;
const scene = new T3.Scene();
const HAZE = new T3.Color('#dfddd3');
const FOG = [6000, 26000];                        // calima real: lo lejano se aclara
// cielo de verano: la calima vive en el horizonte real (no en el borde de la pantalla), y el terreno se funde en ella
const SKY = new T3.Mesh(new T3.SphereGeometry(80000, 48, 24), new T3.ShaderMaterial({
  side: T3.BackSide, depthWrite: false, fog: false,
  uniforms: { haze: { value: HAZE }, zen: { value: new T3.Color('#86a9c6') }, mid: { value: new T3.Color('#b9cedc') } },
  vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `uniform vec3 haze, zen, mid; varying vec3 vDir;
    void main(){ float y = vDir.y; vec3 c = mix(haze, mid, smoothstep(0.0, 0.10, y)); c = mix(c, zen, smoothstep(0.10, 0.55, y));
      gl_FragColor = vec4(c, 1.0);
      #include <colorspace_fragment>
    }`,
}));
SKY.renderOrder = -1; scene.add(SKY);
const camera = new T3.PerspectiveCamera(V ? 52 : 38, W / H, 5, 90000);

// Una sola superficie: cada punto toma la ortofoto más detallada que lo cubre (sin capas que se peleen).
function terrainMesh(b, segs, layers) {
  const [x0, z0, x1, z1] = b, n = segs + 1;
  const pos = new Float32Array(n * n * 3), idx = new Uint32Array(segs * segs * 6);
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
    const x = lerp(x0, x1, i / segs), z = lerp(z0, z1, j / segs), k = j * n + i;
    pos[k * 3] = x; pos[k * 3 + 1] = heightAt(x, z); pos[k * 3 + 2] = z;
  }
  let q = 0;
  for (let j = 0; j < segs; j++) for (let i = 0; i < segs; i++) {
    const a = j * n + i, b2 = a + 1, c = a + n, d = c + 1; idx.set([a, c, b2, b2, c, d], q); q += 6;
  }
  const geo = new T3.BufferGeometry();
  geo.setAttribute('position', new T3.BufferAttribute(pos, 3)); geo.setIndex(new T3.BufferAttribute(idx, 1));
  const N = layers.length;
  const mat = new T3.ShaderMaterial({
    uniforms: {
      tex: { value: layers.map(l => l.tex) }, bnd: { value: layers.map(l => new T3.Vector4(...l.bounds)) },
      fea: { value: layers.map(l => l.feather) },
      fogColor: { value: HAZE }, fogNear: { value: 0 }, fogFar: { value: 1 },
      tint: { value: new T3.Color('#fff4e4') },          // ligera calidez, sigue siendo la foto
    },
    vertexShader: `varying vec3 vW; varying float vD;
      void main(){ vec4 w = modelMatrix*vec4(position,1.0); vW = w.xyz; vec4 mv = viewMatrix*w; vD = -mv.z; gl_Position = projectionMatrix*mv; }`,
    fragmentShader: `uniform sampler2D tex[${N}]; uniform vec4 bnd[${N}]; uniform float fea[${N}];
      uniform vec3 fogColor; uniform float fogNear, fogFar; uniform vec3 tint; varying vec3 vW; varying float vD;
      void main(){
        vec3 col = vec3(0.86); vec2 uv, e; float d, w;
        #pragma unroll_loop_start
        for (int i = 0; i < ${N}; i++) {
          uv = vec2((vW.x - bnd[i].x) / (bnd[i].z - bnd[i].x), 1.0 - (vW.z - bnd[i].y) / (bnd[i].w - bnd[i].y));
          e = min(uv, 1.0 - uv); d = min(e.x, e.y);
          w = fea[i] > 0.0 ? smoothstep(0.0, fea[i], d) : step(0.0, d);
          col = mix(col, texture2D(tex[i], clamp(uv, 0.0, 1.0)).rgb, w);
        }
        #pragma unroll_loop_end
        col = mix(vec3(dot(col, vec3(0.2126, 0.7152, 0.0722))), col, 1.10);   // un toque de viveza
        col = clamp((col - 0.18) * 1.07 + 0.18, 0.0, 1.0) * tint;
        col = mix(col, fogColor, smoothstep(fogNear, fogFar, vD));
        gl_FragColor = vec4(col, 1.0);
        #include <colorspace_fragment>
      }`,
  });
  return new T3.Mesh(geo, mat);
}
let TERRAIN = null;

// ─────────────────────────── ruta real ───────────────────────────
const RP = A.route.map(([x, z]) => new T3.Vector3(x, heightAt(x, z) + 4, z));
const CUM = [0]; for (let i = 1; i < RP.length; i++) CUM.push(CUM[i - 1] + RP[i].distanceTo(RP[i - 1]));
const LEN = CUM[CUM.length - 1];
function routeAt(s) {
  s = clamp(s, 0, LEN); let lo = 0, hi = CUM.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (CUM[m] <= s) lo = m; else hi = m; }
  const u = (s - CUM[lo]) / Math.max(1e-6, CUM[hi] - CUM[lo]);
  return RP[lo].clone().lerp(RP[hi], u);
}
const P = {}; for (const [k, [x, z]] of Object.entries(A.places)) P[k] = new T3.Vector3(x, heightAt(x, z), z);
const yawOf = (dx, dz) => Math.atan2(-dx, -dz);                       // cámara mirando en esa dirección
const BEAR = yawOf(P.finca.x - P.church.x, P.finca.z - P.church.z);    // rumbo general Palma → Alaró

// ─────────────────────────── el guion ───────────────────────────
const TRAVEL = [3.0, 15.4];                          // el autobús sale y llega
const prog = t => ease.smoother(seg(t, TRAVEL[0], TRAVEL[1]));
const headS = t => prog(t) * LEN;
function routeYaw(s) {                                // rumbo suavizado: la cámara no se marea con cada curva
  const a = routeAt(s - 2200), b = routeAt(s + 2200);
  let y = yawOf(b.x - a.x, b.z - a.z);
  let d = ((y - BEAR + Math.PI * 3) % (Math.PI * 2)) - Math.PI;       // mezcla con el rumbo general
  return BEAR + d * 0.45;
}
const angLerp = (a, b, u) => a + ((((b - a) + Math.PI * 3) % (Math.PI * 2)) - Math.PI) * u;

function camPose(t) {
  const s = headS(t), head = routeAt(s), yaw = routeYaw(s);
  const fwd = new T3.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
  const S0 = { T: P.church.clone(), D: V ? 620 : 470, pitch: 89, yaw: BEAR };
  const low = OM.sstep(0.38, 0.78, prog(t));            // al acercarse a la sierra, la cámara levanta la vista
  const S1 = { T: head.clone().addScaledVector(fwd, lerp(900, 1400, low)), D: (V ? 5200 : 4300) * lerp(1, 0.86, low), pitch: lerp(33, 19, low), yaw };
  const S2 = { T: P.finca.clone(), D: V ? 700 : 540, pitch: 89, yaw: BEAR };
  const a = ease.cubicInOut(seg(t, 2.3, 5.8)), c = ease.cubicInOut(seg(t, 13.4, 17.6));
  const mix = (X, Y, u) => ({ T: X.T.clone().lerp(Y.T, u), D: Math.exp(lerp(Math.log(X.D), Math.log(Y.D), u)),
                               pitch: lerp(X.pitch, Y.pitch, u), yaw: angLerp(X.yaw, Y.yaw, u) });
  const p = mix(mix(S0, S1, a), S2, c);
  // la mano del operador: flota en el vuelo, quieta en los planos fijos
  const f = a * (1 - c);
  p.yaw += f * 0.012 * Math.sin(t * 0.83 + 0.4);
  p.pitch += f * 0.6 * Math.sin(t * 1.17 + 1.3);
  // empuje lento en los planos fijos
  p.D *= 1 - 0.06 * ease.sineInOut(seg(t, 0, 2.6)) * (1 - a) - 0.08 * ease.sineInOut(seg(t, 17.0, DUR)) * c;
  return p;
}
const EUL = new T3.Euler(0, 0, 0, 'YXZ');
function placeCamera(cam, p) {
  EUL.set(-p.pitch * Math.PI / 180, p.yaw, 0);
  cam.quaternion.setFromEuler(EUL);
  const dir = new T3.Vector3(0, 0, -1).applyQuaternion(cam.quaternion);
  cam.position.copy(p.T).addScaledVector(dir, -p.D);
  cam.position.y = Math.max(cam.position.y, heightAt(cam.position.x, cam.position.z) + 180);
  cam.updateMatrixWorld(true);
}
function toScreen(v, cam) {
  const p = v.clone().project(cam);
  return { x: (p.x + 1) / 2 * W, y: (1 - p.y) / 2 * H, ok: p.z < 1 && p.z > -1 };
}

// ─────────────────────────── capa 2D: la estela ───────────────────────────
const ov = document.getElementById('ov'); ov.width = W; ov.height = H; const g = ov.getContext('2d');
function drawRoute(t) {
  g.clearRect(0, 0, W, H);
  const s = headS(t), pts = RP.map(v => toScreen(v, camera));
  const routeOn = clamp((t - 2.4) / 0.6, 0, 1);
  const path = (from, to) => {
    g.beginPath(); let pen = false;
    for (let i = 0; i < pts.length; i++) {
      if (CUM[i] < from) continue; if (CUM[i] > to) break;
      const q = pts[i]; if (!q.ok) { pen = false; continue; }
      pen ? g.lineTo(q.x, q.y) : g.moveTo(q.x, q.y); pen = true;
    }
    if (to < LEN) { const hp = toScreen(routeAt(to), camera); if (hp.ok) g.lineTo(hp.x, hp.y); }
  };
  g.lineCap = g.lineJoin = 'round';
  // lo que queda por recorrer: apenas insinuado
  if (routeOn > 0) {
    path(s, LEN); g.strokeStyle = `rgba(252,250,245,${0.42 * routeOn})`; g.lineWidth = 2.4; g.setLineDash([2, 9]); g.stroke(); g.setLineDash([]);
  }
  // lo recorrido: la estela
  if (s > 0) {
    path(0, s);
    g.strokeStyle = 'rgba(28,27,14,.38)'; g.lineWidth = 9; g.stroke();
    g.strokeStyle = '#fcfaf5'; g.lineWidth = 4.2; g.stroke();
  }
  // salida y llegada
  for (const [pt, t0] of [[P.church, 2.5], [P.finca, 2.9]]) {
    const q = toScreen(pt.clone().setY(pt.y + 4), camera), k = spring(t - t0, 0.6, 16);
    if (!q.ok || k <= 0) continue;
    g.fillStyle = 'rgba(28,27,14,.3)'; g.beginPath(); g.arc(q.x, q.y, 10 * k, 0, 7); g.fill();
    g.fillStyle = '#8a7c55'; g.strokeStyle = '#fcfaf5'; g.lineWidth = 3;
    g.beginPath(); g.arc(q.x, q.y, 8 * k, 0, 7); g.fill(); g.stroke();
  }
  // el autobús: un punto de luz que avanza
  const hk = spring(t - 2.55, 0.55, 15);
  if (hk > 0) {
    const q = toScreen(routeAt(s), camera);
    if (q.ok) {
      const arrive = spring(t - TRAVEL[1], 0.5, 12), r = 30 * hk + 8 * Math.max(0, 1 - Math.abs(arrive - 1) * 3);
      const gr = g.createRadialGradient(q.x, q.y, 0, q.x, q.y, r);
      gr.addColorStop(0, 'rgba(255,248,226,.85)'); gr.addColorStop(0.35, 'rgba(255,242,206,.35)'); gr.addColorStop(1, 'rgba(255,242,206,0)');
      g.fillStyle = gr; g.beginPath(); g.arc(q.x, q.y, r, 0, 7); g.fill();
      g.fillStyle = '#fffaf0'; g.beginPath(); g.arc(q.x, q.y, 7.5 * hk, 0, 7); g.fill();
    }
  }
}

// ─────────────────────────── textos y tarjeta ───────────────────────────
const $ = id => document.getElementById(id);
const PAD = V ? 72 : 96;
$('bStart').style.left = PAD + 'px'; $('bStart').style.bottom = (V ? 230 : 92) + 'px';
$('bEnd').style.left = PAD + 'px'; $('bEnd').style.bottom = (V ? 230 : 92) + 'px';
$('eEnd').style.top = (V ? 0.40 : 0.36) * H + 'px';
if (V) for (const e of document.querySelectorAll('.ttl')) e.style.fontSize = '60px';
if (V) document.querySelector('.end .big').style.fontSize = '74px';

function lines(id, t0, tOut) {
  const spans = $(id).querySelectorAll('span'); let any = 0;
  spans.forEach((sp, i) => {
    const w = wordRise(T, t0 + i * 0.13), o = liftOut(T, tOut + i * 0.05, { dur: 0.5, dist: 28, blur: 6 });
    const op = w.op * o.op; any = Math.max(any, op);
    sp.style.opacity = op; sp.style.transform = `translateY(${w.y + o.dy}px) scale(${w.s})`;
    sp.style.filter = o.blur > 0.05 ? `blur(${o.blur}px)` : 'none';
  });
  return any;
}
let T = 0, TA = 12;
function tPass(pt) {                                  // cuándo pasa el autobús junto a ese lugar
  let best = 0, bd = Infinity;
  for (let i = 0; i < RP.length; i++) { const d = (RP[i].x - pt.x) ** 2 + (RP[i].z - pt.z) ** 2; if (d < bd) { bd = d; best = CUM[i]; } }
  let lo = TRAVEL[0], hi = TRAVEL[1];
  for (let k = 0; k < 40; k++) { const m = (lo + hi) / 2; if (headS(m) < best) lo = m; else hi = m; }
  return lo;
}
function label(id, pt, t0, t1, dy = -18) {
  const e = $(id), q = toScreen(pt, camera);
  const edge = Math.min(q.x - 60, W - 420 - q.x, q.y - 80, H - 120 - q.y);   // solo dentro de cuadro
  const k = wordRise(T, t0).op * (1 - ease.smooth(seg(T, t1 - 0.6, t1))) * clamp(edge / 160, 0, 1);
  e.style.opacity = q.ok ? k : 0;
  e.style.transform = `translate(${q.x + 16}px, ${q.y + dy - 18}px) translateY(${(1 - k) * 10}px)`;
}

function cardAt(t) {                                   // la foto real del autobús se pliega en el punto de luz
  const e = $('card'), q = toScreen(P.church, camera);
  const pi = OM.popIn(t, 0.85), fold = ease.expoInOut(seg(t, 2.05, 2.75));
  const cw = 328, ch = 0.62 * 300 + 60, ox = V ? -cw / 2 : 70, oy = V ? -ch - 120 : -ch / 2 - 40;
  const x = lerp(q.x + ox, q.x - cw / 2, fold), y = lerp(q.y + oy + pi.dy, q.y - ch / 2, fold);
  const sc = pi.s * lerp(1, 0.035, fold), rot = lerp(-3.5, 0, fold);
  e.style.opacity = t < 0.85 ? 0 : pi.op * (1 - ease.smooth(seg(t, 2.5, 2.78)));
  e.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg) scale(${sc})`;
}

function seek(t) {
  T = t;
  placeCamera(camera, camPose(t));
  SKY.position.copy(camera.position);
  renderer.render(scene, camera);
  drawRoute(t);
  const a = lines('bStart', 0.35, 3.3);
  const b = lines('bEnd', 16.3, 18.2);
  const c = lines('eEnd', 18.55, 99);
  $('vig').style.opacity = Math.max(a, b, c * 0.9);
  label('lSerra', P.serra, 9.4, 13.9);
  label('lAlaro', P.alaro, TA - 3.2, TA + 0.8);
  cardAt(t);
  if (Q.has('hud')) { $('hud').style.display = 'block'; $('hud').textContent = t.toFixed(2); }
  return true;
}

// ─────────────────────────── carga ───────────────────────────
async function build() {
  const loader = new T3.TextureLoader(), maxAniso = renderer.capabilities.getMaxAnisotropy();
  const layers = [];
  for (const L of [...A.layers].sort((a, b) => a.order - b.order)) {   // de la más amplia a la más detallada
    const tex = await loader.loadAsync(A.textures[L.tex]);
    tex.colorSpace = T3.SRGBColorSpace; tex.anisotropy = maxAniso;
    layers.push({ tex, bounds: L.bounds, feather: L.feather });
  }
  TERRAIN = terrainMesh(A.layers.find(l => l.order === 0).bounds, 760, layers);
  TERRAIN.material.uniforms.fogNear.value = FOG[0]; TERRAIN.material.uniforms.fogFar.value = FOG[1];
  scene.add(TERRAIN);
  TA = tPass(P.alaro);
  await document.fonts.ready;
  await $('busImg').decode();
  renderer.compile(scene, camera);
  seek(0);
}

window.__meta = { dur: DUR, fps: FPS };
window.__seek = async t => seek(t);
window.__ready = build();
window.__motion = (t0, t1) => {                       // recorrido en pantalla entre t0 y t1 (cámara + punto)
  const c0 = new T3.PerspectiveCamera().copy(camera), c1 = new T3.PerspectiveCamera().copy(camera);
  placeCamera(c0, camPose(t0)); placeCamera(c1, camPose(t1));
  const p0 = camPose(t0), probes = [routeAt(headS(t0)), p0.T];
  for (const [dx, dz] of [[-800, -800], [800, -800], [-800, 800], [800, 800]]) probes.push(p0.T.clone().add(new T3.Vector3(dx * p0.D / 2000, 0, dz * p0.D / 2000)));
  let m = 0;
  for (const v of probes) { const a = toScreen(v, c0), b = toScreen(v, c1); if (a.ok && b.ok) m = Math.max(m, Math.hypot(a.x - b.x, a.y - b.y)); }
  const h0 = toScreen(routeAt(headS(t0)), c0), h1 = toScreen(routeAt(headS(t1)), c1);
  if (h0.ok && h1.ok) m = Math.max(m, Math.hypot(h0.x - h1.x, h0.y - h1.y));
  return m;
};
if (Q.has('play')) window.__ready.then(() => { const t0 = performance.now(); const loop = () => { seek(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); }; loop(); });
else if (Q.has('t')) window.__ready.then(() => seek(parseFloat(Q.get('t'))));
})();
</script>
